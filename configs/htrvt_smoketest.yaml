# Throwaway smoke-test config -- tiny iteration count to validate the full
# pipeline (data loading, SAM double forward/backward, EMA, CTC loss,
# greedy decode, scorer integration, checkpoint save) runs end-to-end
# without shape/dtype errors before committing GPU time to the real run.

run_name: htrvt_smoketest
seed: 42
fold: 0
n_folds: 5

target_height: 64
max_width: 512
train_batch_size: 4
val_batch_size: 4
max_lr: 1.0e-3
weight_decay: 0.5
warmup_iters: 5
total_iters: 20
eval_every_iters: 10
print_every_iters: 5
mask_ratio: 0.4
max_span_length: 8
ema_decay: 0.99
use_elastic_augment: false
