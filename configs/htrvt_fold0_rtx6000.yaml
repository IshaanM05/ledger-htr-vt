# HTR-VT scaled for a 48GB card (RTX 6000-class). Same architecture/recipe as
# configs/htrvt_fold0.yaml (the 12GB-laptop version) -- just wider images
# (better CTC-timestep margin for our long lines: 2048/4=512 timesteps vs
# max target length 120, vs 256 timesteps on the laptop config) and a bigger
# batch (matches the paper's own READ2016 recipe batch size, train-bs 128).
# total_iters was originally 4000 as a starting-point guess; the first real
# fold-0 run (docs/HTRVT_FOLD0_RUN_REPORT.md, 2026-09-08, random-init, no
# pretraining) found val_final peaked at iter 1700 (0.1207) then degraded to
# 0.0888 by iter 4000 -- training loss kept falling the whole time with no
# corresponding validation gain past ~40% of the run, a real overfitting
# pattern for this from-scratch recipe on ~3.3k rows/fold. Lowered to 2000
# (comfortable margin over the observed 1700 peak) to stop paying for the
# back half of a run that was net-negative -- the best checkpoint is always
# kept regardless, so this is a compute saving, not a correctness change.
# Revisit once the multi-dataset pretraining pass (plan-mandated, not yet
# built) changes the starting point enough that the optimal length shifts.

run_name: htrvt_fold0_rtx6000
seed: 42
fold: 0
n_folds: 5

target_height: 64
max_width: 2048
train_batch_size: 128
val_batch_size: 32
max_lr: 1.0e-3
weight_decay: 0.5
warmup_iters: 200
total_iters: 2000
eval_every_iters: 100
print_every_iters: 25
mask_ratio: 0.4
max_span_length: 8
ema_decay: 0.9999
use_elastic_augment: false
use_bf16: true
num_workers: 8
pin_memory: true
